<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061719">
<title>КоляДжамп</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none!important;
  -webkit-user-select:none!important;
  user-select:none!important;
}
html,body{
  margin:0;background:#041113;color:#efffff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-touch-callout:none!important;
  -webkit-user-select:none!important;
  user-select:none!important;
}
button{
  -webkit-appearance:none;appearance:none;
  -webkit-touch-callout:none!important;
  -webkit-user-select:none!important;
  user-select:none!important;
  touch-action:manipulation;
}
#wrap{height:100dvh;max-width:560px;margin:auto;position:relative;background:radial-gradient(circle at 50% 0,#123c3e,#061719 45%,#02090b)}
canvas{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:8}
.back,.sound{border:1px solid #81d8d055;background:#092326dd;color:#bafff8;border-radius:16px;height:46px;padding:0 15px;font-weight:800}
.title{text-align:center;font-weight:950;font-size:18px}.title small{display:block;font-size:10px;color:#8eb8b5;letter-spacing:.12em;margin-top:2px}
.hud{position:absolute;top:calc(env(safe-area-inset-top) + 68px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.card{background:#06191cdd;border:1px solid #81d8d033;border-radius:18px;padding:9px 12px;min-width:96px;backdrop-filter:blur(12px)}
.card:last-child{text-align:right}.lab{font-size:9px;color:#8eb8b5;letter-spacing:.13em}.val{font-size:20px;font-weight:950}
.controls{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);display:flex;justify-content:space-between;z-index:6;pointer-events:none}
.ctrl{
  pointer-events:auto;width:98px;height:98px;border-radius:50%;
  border:1px solid #a6f3ea66;
  background:
    radial-gradient(circle at 34% 25%,rgba(255,255,255,.10),transparent 30%),
    linear-gradient(180deg,#123b3dee,#071f22f5);
  color:#bafff8;font-size:52px;line-height:1;
  box-shadow:0 18px 40px #0008,inset 0 1px rgba(255,255,255,.11),0 0 28px rgba(129,216,208,.08);
  font-weight:500;
  outline:none;
}
.ctrl:active,.ctrl.down{transform:scale(.92);background:linear-gradient(180deg,#174c4fee,#0a2a2df5)}
#start{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 43px);transform:translateX(-50%);border:0;border-radius:999px;padding:16px 24px;background:linear-gradient(135deg,#b8fff8,#65cec5);color:#052321;font-weight:950;box-shadow:0 15px 35px #81d8d044;z-index:7}
.boost{position:absolute;top:150px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#a6f3ea;color:#052321;border-radius:999px;padding:9px 14px;font-weight:950;transition:.18s;z-index:9}
.boost.show{opacity:1;transform:translate(-50%,0)}

#chooser{
  position:absolute;inset:0;z-index:20;
  background:
    radial-gradient(circle at 50% 12%,rgba(129,216,208,.18),transparent 31%),
    linear-gradient(180deg,rgba(3,15,17,.97),rgba(2,9,11,.995));
  padding:calc(env(safe-area-inset-top) + 72px) 16px calc(env(safe-area-inset-bottom) + 20px);
  overflow:auto
}
.chooseTitle{text-align:center;font-size:25px;font-weight:1000;letter-spacing:-.02em}
.chooseSub{text-align:center;color:#8eb8b5;font-size:13px;margin:7px auto 18px;max-width:350px}
.heroes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.heroCard{
  position:relative;border:1px solid #81d8d033;
  background:
    radial-gradient(circle at 50% 18%,rgba(129,216,208,.10),transparent 44%),
    linear-gradient(180deg,#0b2528,#061618);
  border-radius:22px;padding:10px;color:white;text-align:left;min-height:174px;overflow:hidden;
  box-shadow:inset 0 1px rgba(255,255,255,.03),0 13px 30px rgba(0,0,0,.16)
}
.heroCard:last-child{grid-column:1/-1}
.heroCard.selected{border-color:#a6f3eacc;box-shadow:0 0 0 2px #81d8d022,0 18px 45px #0007}
.heroArt{
      height:116px;position:relative;display:grid;place-items:center;overflow:hidden;
      border-radius:16px;background:#071719
    }
    .heroArt img{
      width:100%;height:100%;object-fit:contain;object-position:center center;
      display:block;filter:saturate(1.04) contrast(1.03)
    }
    .heroArt:after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(180deg,transparent 52%,rgba(3,15,17,.85) 100%);
    }
.heroName{font-weight:950;font-size:15px}.heroType{font-size:10px;color:#8eb8b5;margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.check{position:absolute;right:10px;top:10px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#81d8d0;color:#052321;font-weight:1000;opacity:0;transform:scale(.7);transition:.15s;z-index:4}
.heroCard.selected .check{opacity:1;transform:scale(1)}
#chooseBtn{position:sticky;bottom:0;margin-top:14px;width:100%;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#b8fff8,#65cec5);color:#052321;font-size:15px;font-weight:1000;box-shadow:0 18px 45px #0008}
.tip{margin-top:12px;text-align:center;color:#769e9c;font-size:11px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g" width="450" height="800"></canvas>

<div class="top">
  <button class="back" id="backBtn">‹ Назад</button>
  <div class="title">КоляДжамп<small id="heroLabel">ВЫБЕРИ ГЕРОЯ</small></div>
  <button id="snd" class="sound">🔊</button>
</div>

<div class="hud">
  <div class="card"><div class="lab">СЧЁТ</div><div id="score" class="val">0</div></div>
  <div class="card"><div class="lab">ВЫСОТА</div><div id="height" class="val">0 м</div></div>
</div>

<div id="boost" class="boost">БУСТ</div>

<div class="controls">
  <button id="L" class="ctrl" aria-label="Влево">‹</button>
  <button id="R" class="ctrl" aria-label="Вправо">›</button>
</div>

<button id="start">▶ ИГРАТЬ</button>

<div id="chooser">
  <div class="chooseTitle">Выбери героя</div>
  <div class="chooseSub">Теперь герои выглядят как нормальные игровые персонажи, а не как преступление против пикселей.</div>

  <div class="heroes">
    <button class="heroCard selected" data-hero="pudge"><span class="check">✓</span><div class="heroArt" id="art-pudge"><img src="./kolyajump-assets/pudge.png" alt=""></div><div class="heroName">Пудж</div><div class="heroType">Мясник</div></button>
    <button class="heroCard" data-hero="techies"><span class="check">✓</span><div class="heroArt" id="art-techies"><img src="./kolyajump-assets/techies.png" alt=""></div><div class="heroName">Течис</div><div class="heroType">Подрывники</div></button>
    <button class="heroCard" data-hero="lina"><span class="check">✓</span><div class="heroArt" id="art-lina"><img src="./kolyajump-assets/lina.png" alt=""></div><div class="heroName">Лина</div><div class="heroType">Огненная магия</div></button>
    <button class="heroCard" data-hero="rubick"><span class="check">✓</span><div class="heroArt" id="art-rubick"><img src="./kolyajump-assets/rubick.png" alt=""></div><div class="heroName">Рубик</div><div class="heroType">Великий маг</div></button>
    <button class="heroCard" data-hero="tide"><span class="check">✓</span><div class="heroArt" id="art-tide"><img src="./kolyajump-assets/tide.png" alt=""></div><div class="heroName">Тайдхантер</div><div class="heroType">Морской громила</div></button>
  </div>

  <button id="chooseBtn">Играть за Пуджа</button>
  <div class="tip">Выбор сохраняется, но при следующем входе можно поменять героя.</div>
</div>
</div>

<script>
const c=document.querySelector('#g'),x=c.getContext('2d'),W=c.width,H=c.height,$=s=>document.querySelector(s);

let run=0,left=0,right=0,cam=0,score=0,height=0,last=0,sound=1,plats=[],items=[];
let selectedHero='pudge';
let player={x:196,y:610,w:62,h:90,vx:0,vy:-760};
let audioCtx=null,musicNodes=[],musicTimer=null;

const heroMeta={
  pudge:{name:'Пудж',body:'#616843',body2:'#282f20',skin:'#b59a76',accent:'#b5423d',eye:'#e6d88e'},
  techies:{name:'Течис',body:'#815126',body2:'#3b281b',skin:'#c69063',accent:'#efc64c',eye:'#ffe56d'},
  lina:{name:'Лина',body:'#8d261d',body2:'#3b1110',skin:'#e0ad8b',accent:'#ff6937',eye:'#ffc099'},
  rubick:{name:'Рубик',body:'#205a3c',body2:'#0d2c1d',skin:'#88b98a',accent:'#7cff82',eye:'#9cff9f'},
  tide:{name:'Тайдхантер',body:'#357a68',body2:'#153e37',skin:'#63a68e',accent:'#c9e585',eye:'#efffb1'}
};

const heroRenderUrls={
  pudge:'./kolyajump-assets/pudge.png',
  techies:'./kolyajump-assets/techies.png',
  lina:'./kolyajump-assets/lina.png',
  rubick:'./kolyajump-assets/rubick.png',
  tide:'./kolyajump-assets/tide.png'
};
const bottleImages={};
for(const [key,url] of Object.entries({
  beer:'./kolyajump-assets/beer.png',
  vodka:'./kolyajump-assets/vodka.png',
  tequila:'./kolyajump-assets/tequila.png'
})){
  const im=new Image(); im.src=url; bottleImages[key]=im;
}
const heroRenderImages={};
for(const [key,url] of Object.entries(heroRenderUrls)){
  const im=new Image();
  im.crossOrigin='anonymous';
  im.src=url;
  heroRenderImages[key]=im;
}


const fart=new Audio('./kolyajump-fart.mp3');
const burp=new Audio('./kolyajump-burp.mp3');
fart.playbackRate=1.8;
burp.playbackRate=1.2;

function ensureAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function playFile(a){
  if(!sound)return;
  try{a.pause();a.currentTime=0;a.play().catch(()=>{})}catch{}
}
function clickSound(){
  if(!sound)return;
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(470,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(280,audioCtx.currentTime+.045);
  g.gain.setValueAtTime(.055,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.065);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.07);
}
function startMusic(){
  if(!sound)return;
  ensureAudio();
  stopMusic();
  const master=audioCtx.createGain();
  master.gain.value=.035;
  master.connect(audioCtx.destination);
  musicNodes.push(master);

  const bass=audioCtx.createOscillator();
  const bassGain=audioCtx.createGain();
  bass.type='sine';bass.frequency.value=55;
  bassGain.gain.value=.34;
  bass.connect(bassGain);bassGain.connect(master);bass.start();
  musicNodes.push(bass,bassGain);

  const pad=audioCtx.createOscillator();
  const padGain=audioCtx.createGain();
  pad.type='triangle';pad.frequency.value=110;
  padGain.gain.value=.14;
  pad.connect(padGain);padGain.connect(master);pad.start();
  musicNodes.push(pad,padGain);

  const notes=[220,246.94,293.66,329.63,293.66,246.94];
  let idx=0;
  function pluck(){
    if(!audioCtx||!sound)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=notes[idx++%notes.length];
    g.gain.setValueAtTime(.06,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.42);
    o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+.45);
  }
  pluck();
  musicTimer=setInterval(pluck,520);
}
function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null}
  musicNodes.forEach(n=>{try{n.stop?.()}catch{}try{n.disconnect?.()}catch{}});
  musicNodes=[];
}

function diff(){
  let l=Math.min(12,1+Math.floor(height/150));
  return{l,g:1850+l*65,j:755+l*5,gap:82+l*5,w:115-l*4.5,spd:1+(l-1)*.05}
}

function add(y){
  let d=diff(),w=Math.max(55,d.w+Math.random()*35);
  let type='normal';
  const r=Math.random();
  if(r<Math.min(.31,d.l*.024))type='move';
  else if(r<Math.min(.31,d.l*.024)+Math.min(.20,Math.max(0,d.l-2)*.023))type='break';

  let p={x:18+Math.random()*(W-w-36),y,w,h:15,type,base:0,ph:Math.random()*6.28,dead:0};
  p.base=p.x;plats.push(p);

  // Бутылки не на каждой второй платформе, но и не исчезли с лица земли.
  if(Math.random()<.115){
    const types=['beer','vodka','tequila'];
    items.push({x:p.x+w/2,y:y-42,t:types[Math.floor(Math.random()*types.length)],on:1,bob:Math.random()*6.28})
  }
}

function reset(){
  score=height=cam=0;
  player={x:194,y:610,w:62,h:90,vx:0,vy:-760};
  plats=[];items=[];
  let y=690;
  plats.push({x:155,y,w:140,h:15,type:'normal',base:155,ph:0,dead:0});
  for(let i=0;i<16;i++){y-=90+Math.random()*30;add(y)}
  draw(0)
}

function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}

function bg(t){
  let g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#153e40');g.addColorStop(.48,'#071b1e');g.addColorStop(1,'#02090b');
  x.fillStyle=g;x.fillRect(0,0,W,H);

  const rg=x.createRadialGradient(W*.5,H*.16,10,W*.5,H*.16,300);
  rg.addColorStop(0,'rgba(129,216,208,.17)');
  rg.addColorStop(1,'rgba(129,216,208,0)');
  x.fillStyle=rg;x.fillRect(0,0,W,H);

  for(let i=0;i<46;i++){
    x.globalAlpha=.13+(i%5)*.055;x.fillStyle='#dffffb';
    const yy=((i*137)+(t*.012*(1+(i%3))))%H;
    x.fillRect((i*89)%W,yy,1.4,1.4)
  }
  x.globalAlpha=1;

  // Далёкий город
  x.fillStyle='rgba(2,10,12,.55)';
  for(let i=0;i<14;i++){
    const bw=24+(i%4)*8,bh=70+(i*47)%165,bx=i*36-16;
    x.fillRect(bx,H-bh,bw,bh);
    x.fillStyle='rgba(129,216,208,.07)';
    for(let yy=H-bh+15;yy<H-20;yy+=21){
      for(let xx=bx+7;xx<bx+bw-4;xx+=12)x.fillRect(xx,yy,3,5)
    }
    x.fillStyle='rgba(2,10,12,.55)';
  }
}

function drawBottle(o,t){
  if(!o.on)return;
  const yy=o.y-cam+Math.sin(t*.004+o.bob)*5;
  if(yy<-80||yy>H+60)return;
  const im=bottleImages[o.t];
  x.save();
  x.translate(o.x,yy);
  const pulse=1+Math.sin(t*.006+o.bob)*.035;
  x.scale(pulse,pulse);
  x.shadowColor='rgba(129,216,208,.45)';
  x.shadowBlur=18;
  if(im&&im.complete&&im.naturalWidth){
    const dh=o.t==='beer'?64:70;
    const dw=dh*(im.naturalWidth/im.naturalHeight);
    x.drawImage(im,-dw/2,-dh/2,dw,dh);
  }
  x.restore();
}

function drawHeroFallback(hero,px,y,scale=1,portrait=false){
  const m=heroMeta[hero],cx=px+31*scale;
  x.save();

  // Тень
  if(!portrait){
    x.fillStyle='rgba(0,0,0,.20)';
    x.beginPath();x.ellipse(cx,y+88*scale,23*scale,7*scale,0,0,Math.PI*2);x.fill();
  }

  // Ноги
  if(!portrait){
    x.strokeStyle=m.body2;x.lineWidth=14*scale;x.lineCap='round';
    x.beginPath();
    x.moveTo(px+24*scale,y+63*scale);x.lineTo(px+17*scale,y+84*scale);
    x.moveTo(px+39*scale,y+63*scale);x.lineTo(px+47*scale,y+83*scale);x.stroke();

    x.strokeStyle='#132326';x.lineWidth=8*scale;
    x.beginPath();x.moveTo(px+12*scale,y+85*scale);x.lineTo(px+22*scale,y+85*scale);
    x.moveTo(px+43*scale,y+84*scale);x.lineTo(px+53*scale,y+84*scale);x.stroke();

    // Руки
    x.strokeStyle=m.skin;x.lineWidth=12*scale;
    x.beginPath();
    x.moveTo(px+16*scale,y+40*scale);x.lineTo(px+5*scale,y+54*scale);
    x.moveTo(px+46*scale,y+40*scale);x.lineTo(px+57*scale,y+53*scale);x.stroke();

    // Торс
    let g=x.createLinearGradient(0,y+28*scale,0,y+69*scale);
    g.addColorStop(0,m.body);g.addColorStop(1,m.body2);
    x.fillStyle=g;rr(px+6*scale,y+27*scale,50*scale,47*scale,16*scale);x.fill();
    x.fillStyle=m.accent;rr(px+20*scale,y+36*scale,22*scale,5*scale,2*scale);x.fill();
  }

  // Голова
  x.fillStyle=m.skin;
  x.beginPath();x.arc(cx,y+20*scale,28*scale,0,Math.PI*2);x.fill();

  if(hero==='pudge'){
    x.fillStyle='#5a2a24';rr(cx-21*scale,y+8*scale,42*scale,8*scale,4*scale);x.fill();
    x.strokeStyle='#6d2b25';x.lineWidth=3*scale;
    x.beginPath();x.moveTo(cx-15*scale,y+31*scale);x.lineTo(cx+15*scale,y+31*scale);x.stroke();
    x.fillStyle=m.eye;x.beginPath();x.arc(cx-10*scale,y+19*scale,3*scale,0,Math.PI*2);x.arc(cx+10*scale,y+19*scale,3*scale,0,Math.PI*2);x.fill();
    x.strokeStyle='#907455';x.lineWidth=2*scale;
    x.beginPath();x.moveTo(cx-21*scale,y+25*scale);x.lineTo(cx-28*scale,y+30*scale);x.stroke();
  }else if(hero==='techies'){
    // Шлем, очки, сумасшедшая морда.
    x.fillStyle='#4d321f';x.beginPath();x.arc(cx,y+8*scale,25*scale,3.1,6.25);x.fill();
    x.fillStyle='#ad6e2e';rr(cx-21*scale,y-3*scale,42*scale,8*scale,4*scale);x.fill();
    x.strokeStyle='#efc64c';x.lineWidth=4*scale;
    x.beginPath();x.arc(cx-10*scale,y+19*scale,7*scale,0,Math.PI*2);x.arc(cx+10*scale,y+19*scale,7*scale,0,Math.PI*2);x.stroke();
    x.strokeStyle='#efc64c';x.beginPath();x.moveTo(cx-3*scale,y+19*scale);x.lineTo(cx+3*scale,y+19*scale);x.stroke();
    x.fillStyle='#3a2317';x.beginPath();x.arc(cx,y+32*scale,7*scale,.1,Math.PI-.1);x.fill();
  }else if(hero==='lina'){
    // Огненные волосы.
    x.fillStyle='#e4512e';
    x.beginPath();
    x.moveTo(cx-23*scale,y+8*scale);x.lineTo(cx-13*scale,y-14*scale);x.lineTo(cx-5*scale,y+1*scale);
    x.lineTo(cx+6*scale,y-18*scale);x.lineTo(cx+11*scale,y+2*scale);x.lineTo(cx+22*scale,y-8*scale);
    x.lineTo(cx+25*scale,y+9*scale);x.closePath();x.fill();
    x.fillStyle='#5b2a20';x.beginPath();x.arc(cx-10*scale,y+20*scale,2.7*scale,0,Math.PI*2);x.arc(cx+10*scale,y+20*scale,2.7*scale,0,Math.PI*2);x.fill();
    x.strokeStyle='#a74a32';x.lineWidth=2*scale;x.beginPath();x.arc(cx,y+28*scale,9*scale,.2,Math.PI-.2);x.stroke();
  }else if(hero==='rubick'){
    x.fillStyle='#102e20';x.beginPath();x.moveTo(cx-25*scale,y+10*scale);x.lineTo(cx,y-18*scale);x.lineTo(cx+25*scale,y+10*scale);x.closePath();x.fill();
    x.fillStyle=m.eye;x.shadowColor=m.eye;x.shadowBlur=10*scale;
    x.beginPath();x.arc(cx-9*scale,y+20*scale,4*scale,0,Math.PI*2);x.arc(cx+9*scale,y+20*scale,4*scale,0,Math.PI*2);x.fill();
    x.shadowBlur=0;
    x.strokeStyle=m.accent;x.lineWidth=3*scale;x.beginPath();x.arc(cx,y+27*scale,11*scale,.2,Math.PI-.2);x.stroke();
  }else if(hero==='tide'){
    // Морской громила с клыками.
    x.fillStyle='#255a50';x.beginPath();x.arc(cx,y+7*scale,25*scale,3.1,6.2);x.fill();
    x.fillStyle=m.eye;x.beginPath();x.arc(cx-10*scale,y+20*scale,3*scale,0,Math.PI*2);x.arc(cx+10*scale,y+20*scale,3*scale,0,Math.PI*2);x.fill();
    x.fillStyle='#ecf7c4';
    x.beginPath();
    x.moveTo(cx-16*scale,y+32*scale);x.lineTo(cx-10*scale,y+22*scale);x.lineTo(cx-5*scale,y+32*scale);
    x.moveTo(cx+5*scale,y+32*scale);x.lineTo(cx+10*scale,y+22*scale);x.lineTo(cx+16*scale,y+32*scale);x.fill();
    x.strokeStyle='#173c35';x.lineWidth=2*scale;x.beginPath();x.moveTo(cx-12*scale,y+28*scale);x.lineTo(cx+12*scale,y+28*scale);x.stroke();
  }

  x.strokeStyle='rgba(223,255,251,.70)';x.lineWidth=2*scale;x.beginPath();x.arc(cx,y+20*scale,28*scale,0,Math.PI*2);x.stroke();
  x.restore();
}

function drawHero(){
  const idle=Math.sin(performance.now()*.008)*1.6;
  const y=player.y-cam+idle, px=player.x, cx=px+31;
  const im=heroRenderImages[selectedHero];

  ctxSave=x.save.bind(x);
  x.save();
  x.translate(cx,y+48);
  x.rotate(Math.max(-.13,Math.min(.13,player.vx/1750)));
  x.translate(-cx,-(y+48));

  if(im && im.complete && im.naturalWidth>10){
    // Fit the original full-body Dota render inside the gameplay character box.
    const maxW=122, maxH=150;
    const scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);
    const dw=im.naturalWidth*scale;
    const dh=im.naturalHeight*scale;

    // Face movement direction by flipping the render.
    const facing=player.vx < -20 ? -1 : 1;
    x.save();
    x.translate(cx,y+87);
    x.scale(facing,1);

    // soft ground shadow
    x.fillStyle='rgba(0,0,0,.24)';
    x.beginPath();
    x.ellipse(0,0,Math.max(16,dw*.34),6,0,0,Math.PI*2);
    x.fill();

    // subtle teal halo so hero remains readable on dark background
    x.shadowColor='rgba(129,216,208,.22)';
    x.shadowBlur=11;
    x.drawImage(im,-dw/2,-dh,dw,dh);
    x.shadowBlur=0;
    x.restore();
  }else{
    drawHeroFallback(selectedHero,px,y,1,false);
  }

  x.restore();
}

function draw(t){
  bg(t);
  for(let p of plats){
    let yy=p.y-cam;if(yy<-30||yy>H+30||p.dead)continue;
    let gr=x.createLinearGradient(0,yy,0,yy+15);
    gr.addColorStop(0,'#d2fffb');gr.addColorStop(.30,'#81D8D0');gr.addColorStop(1,'#277f7b');
    x.shadowColor='#81d8d077';x.shadowBlur=18;x.fillStyle=gr;rr(p.x,yy,p.w,15,8);x.fill();x.shadowBlur=0;
    x.strokeStyle='rgba(255,255,255,.24)';x.lineWidth=1;rr(p.x+.5,yy+.5,p.w-1,14,8);x.stroke();
    x.fillStyle='rgba(255,255,255,.28)';rr(p.x+8,yy+3,Math.max(12,p.w-16),3,2);x.fill();

    if(p.type==='move'){
      x.fillStyle='#06302f';x.font='bold 11px sans-serif';x.textAlign='center';x.fillText('↔',p.x+p.w/2,yy+11)
    }
    if(p.type==='break'){
      x.strokeStyle='#275f5c';x.lineWidth=2;x.beginPath();x.moveTo(p.x+p.w*.45,yy+1);x.lineTo(p.x+p.w*.52,yy+8);x.lineTo(p.x+p.w*.47,yy+14);x.stroke()
    }
  }
  items.forEach(o=>drawBottle(o,t));
  drawHero();
}

function boost(o){
  if(o.t==='beer'){
    playFile(fart);
    player.vy=-900;
    $('#boost').textContent='🍺 ПИВО · ВЫШЕ';
  }else if(o.t==='vodka'){
    playFile(burp);
    player.vy=-1040;
    $('#boost').textContent='🍸 ВОДКА · СУПЕРПРЫЖОК';
  }else{
    playFile(burp);
    player.vy=-955;
    player.vx*=1.55;
    $('#boost').textContent='🌵 ТЕКИЛА · ТУРБО';
  }

  score+=350;
  $('#boost').classList.add('show');
  setTimeout(()=>$('#boost').classList.remove('show'),700);
}

function upd(dt,t){
  let d=diff();

  if(left)player.vx-=920*dt;
  if(right)player.vx+=920*dt;
  if(!left&&!right)player.vx*=Math.pow(.001,dt);

  player.vx=Math.max(-395,Math.min(395,player.vx));
  player.x+=player.vx*dt*d.spd;

  if(player.x<-55)player.x=W;
  if(player.x>W)player.x=-55;

  let old=player.y+player.h;
  player.vy+=d.g*dt*d.spd;
  player.y+=player.vy*dt*d.spd;
  let now=player.y+player.h;

  for(let p of plats){
    if(p.type==='move')p.x=p.base+Math.sin(t*.0018+p.ph)*40;

    if(!p.dead&&player.vy>0&&old<=p.y+3&&now>=p.y&&player.x+50>p.x&&player.x+12<p.x+p.w){
      player.y=p.y-player.h;
      player.vy=-d.j;
      score+=100+d.l*10;
      clickSound();
      if(p.type==='break')setTimeout(()=>p.dead=1,80);
      break
    }
  }

  for(let o of items){
    if(o.on&&Math.hypot(player.x+31-o.x,player.y+40-o.y)<38){
      o.on=0;
      boost(o)
    }
  }

  if(player.y-cam<H*.39){
    let oldc=cam;
    cam=player.y-H*.39;
    height+=Math.max(0,oldc-cam)*.14;
    score+=Math.max(0,oldc-cam)*.3
  }

  let min=Math.min(...plats.map(p=>p.y));
  while(min-cam>-150){min-=d.gap+Math.random()*45;add(min)}

  plats=plats.filter(p=>p.y-cam<H+100);
  items=items.filter(o=>o.y-cam<H+100&&o.on);

  $('#score').textContent=Math.floor(score).toLocaleString('ru');
  $('#height').textContent=Math.floor(height)+' м';

  if(player.y-cam>H+100){
    run=0;
    stopMusic();
    $('#start').style.display='block';
    $('#start').textContent='↻ ЕЩЁ РАЗ';
    return 0
  }
  return 1
}

function loop(t){
  if(!run)return;
  let dt=Math.min(.025,(t-last)/1000||.016);
  last=t;
  if(upd(dt,t)){draw(t);requestAnimationFrame(loop)}else draw(t)
}

function hold(id,set){
  const e=$(id);
  const on=a=>{
    a.preventDefault();
    if(a.pointerId!==undefined)try{e.setPointerCapture(a.pointerId)}catch{}
    set(1);
    e.classList.add('down');
  };
  const off=a=>{
    a.preventDefault();
    if(a.pointerId!==undefined)try{e.releasePointerCapture(a.pointerId)}catch{}
    set(0);
    e.classList.remove('down');
  };
  e.addEventListener('pointerdown',on,{passive:false});
  e.addEventListener('pointerup',off,{passive:false});
  e.addEventListener('pointercancel',off,{passive:false});
  e.addEventListener('contextmenu',a=>a.preventDefault());
  e.addEventListener('selectstart',a=>a.preventDefault());
  e.addEventListener('touchstart',a=>a.preventDefault(),{passive:false});
}
hold('#L',v=>left=v);
hold('#R',v=>right=v);

$('#start').onclick=()=>{
  ensureAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
  reset();
  run=1;
  last=performance.now();
  $('#start').style.display='none';
  startMusic();
  requestAnimationFrame(loop)
};

$('#snd').onclick=e=>{
  sound=!sound;
  e.currentTarget.textContent=sound?'🔊':'🔇';
  if(sound&&run)startMusic(); else stopMusic();
};

$('#backBtn').onclick=()=>{
  stopMusic();
  location.href='./index.html';
};

document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.ctrl'))e.preventDefault();
});
document.addEventListener('selectstart',e=>{
  if(e.target.closest('.ctrl'))e.preventDefault();
});

document.querySelectorAll('.heroCard').forEach(card=>{
  card.addEventListener('click',()=>{
    selectedHero=card.dataset.hero;
    document.querySelectorAll('.heroCard').forEach(c=>c.classList.toggle('selected',c===card));
    $('#chooseBtn').textContent='Играть за '+heroMeta[selectedHero].name;
  })
});

$('#chooseBtn').onclick=()=>{
  ensureAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
  $('#chooser').style.display='none';
  $('#heroLabel').textContent=heroMeta[selectedHero].name.toUpperCase();
  try{localStorage.setItem('kolyajump.hero',selectedHero)}catch{}
  reset()
};


document.querySelectorAll('.heroArt img').forEach(img=>{
  img.addEventListener('error',()=>{
    const key=img.closest('.heroCard')?.dataset?.hero;
    const m=heroMeta[key]||heroMeta.pudge;
    img.style.display='none';
    const host=img.parentElement;
    host.innerHTML=`<div style="width:78px;height:78px;border-radius:50%;background:${m.skin};border:3px solid ${m.accent};box-shadow:0 12px 28px #0008,0 0 25px ${m.accent}44"></div>`;
  },{once:true});
});

try{
  const saved=localStorage.getItem('kolyajump.hero');
  if(saved&&heroMeta[saved]){
    selectedHero=saved;
    document.querySelectorAll('.heroCard').forEach(c=>c.classList.toggle('selected',c.dataset.hero===saved));
    $('#chooseBtn').textContent='Играть за '+heroMeta[saved].name;
  }
}catch{}

reset();
</script>
