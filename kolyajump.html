<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061719"><title>КоляДжамп</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#041113;color:#efffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overflow:hidden}#wrap{height:100dvh;max-width:560px;margin:auto;position:relative;background:radial-gradient(circle at 50% 0,#123c3e,#061719 45%,#02090b)}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:4}.back,.sound{border:1px solid #81d8d055;background:#092326dd;color:#bafff8;border-radius:16px;height:46px;padding:0 15px;font-weight:800}.title{text-align:center;font-weight:950;font-size:18px}.title small{display:block;font-size:10px;color:#8eb8b5;letter-spacing:.12em;margin-top:2px}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 68px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.card{background:#06191cdd;border:1px solid #81d8d033;border-radius:18px;padding:9px 12px;min-width:96px;backdrop-filter:blur(12px)}.card:last-child{text-align:right}.lab{font-size:9px;color:#8eb8b5;letter-spacing:.13em}.val{font-size:20px;font-weight:950}.controls{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);display:flex;justify-content:space-between}.ctrl{width:94px;height:94px;border-radius:50%;border:1px solid #a6f3ea55;background:linear-gradient(#123b3ddd,#071f22ee);color:#a6f3ea;font-size:50px;box-shadow:0 18px 40px #0008,inset 0 1px #fff2}.ctrl:active{transform:scale(.93)}#start{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 43px);transform:translateX(-50%);border:0;border-radius:999px;padding:16px 24px;background:linear-gradient(135deg,#b8fff8,#65cec5);color:#052321;font-weight:950;box-shadow:0 15px 35px #81d8d044}.boost{position:absolute;top:150px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#a6f3ea;color:#052321;border-radius:999px;padding:9px 14px;font-weight:950;transition:.18s}.boost.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div id="wrap"><canvas id="g" width="450" height="800"></canvas><div class="top"><button class="back" onclick="location.href='./index.html'">‹ Назад</button><div class="title">КоляДжамп<small>НЕДЕЛЬНЫЙ ТУРНИР</small></div><button id="snd" class="sound">🔊</button></div><div class="hud"><div class="card"><div class="lab">СЧЁТ</div><div id="score" class="val">0</div></div><div class="card"><div class="lab">ВЫСОТА</div><div id="height" class="val">0 м</div></div></div><div id="boost" class="boost">БУСТ</div><div class="controls"><button id="L" class="ctrl">‹</button><button id="R" class="ctrl">›</button></div><button id="start">▶ ИГРАТЬ</button></div><script>
const c=document.querySelector('#g'),x=c.getContext('2d'),W=c.width,H=c.height,$=s=>document.querySelector(s);let run=0,left=0,right=0,cam=0,score=0,height=0,last=0,sound=1,plats=[],items=[],parts=[];let player={x:200,y:610,w:52,h:82,vx:0,vy:-760};let info={name:'Колян',avatar_url:''};try{info=JSON.parse(localStorage.getItem('kolyajump.player'))||info}catch{};const face=new Image();if(info.avatar_url)face.src=info.avatar_url;const fart=new Audio('./kolyajump-fart.mp3'),burp=new Audio('./kolyajump-burp.mp3');fart.playbackRate=1.8;burp.playbackRate=1.2;function play(a){if(!sound)return;a.pause();a.currentTime=0;a.play().catch(()=>{})}function diff(){let l=Math.min(12,1+Math.floor(height/150));return{l,g:1850+l*65,j:755+l*5,gap:82+l*5,w:115-l*4.5,spd:1+(l-1)*.05}}function add(y){let d=diff(),w=Math.max(55,d.w+Math.random()*35),p={x:18+Math.random()*(W-w-36),y,w,h:15,type:Math.random()<Math.min(.32,d.l*.025)?'move':Math.random()<Math.min(.22,(d.l-2)*.025)?'break':'normal',base:0,ph:Math.random()*6.28,dead:0};p.base=p.x;plats.push(p);if(Math.random()<.24)items.push({x:p.x+w/2,y:y-35,t:['🍺','🍸','🥃','🌵'][Math.floor(Math.random()*4)],on:1})}function reset(){score=height=cam=0;player={x:200,y:610,w:52,h:82,vx:0,vy:-760};plats=[];items=[];parts=[];let y=690;plats.push({x:155,y,w:140,h:15,type:'normal',base:155,ph:0,dead:0});for(let i=0;i<16;i++){y-=90+Math.random()*30;add(y)}draw(0)}function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12383b');g.addColorStop(.5,'#071b1e');g.addColorStop(1,'#02090b');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<45;i++){x.globalAlpha=.15+(i%5)*.06;x.fillStyle='#dffffb';x.fillRect((i*89)%W,(i*137)%H,1.5,1.5)}x.globalAlpha=1}function bottle(o,t){if(!o.on)return;let yy=o.y-cam+Math.sin(t*.004+o.x)*4;if(yy<-30||yy>H)return;x.font='28px sans-serif';x.textAlign='center';x.shadowColor='#81d8d0';x.shadowBlur=14;x.fillText(o.t,o.x,yy);x.shadowBlur=0}function dude(){let y=player.y-cam,cx=player.x+26;x.strokeStyle='#071315';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(player.x+19,y+58);x.lineTo(player.x+13,y+79);x.moveTo(player.x+34,y+58);x.lineTo(player.x+41,y+79);x.moveTo(player.x+13,y+36);x.lineTo(player.x+2,y+49);x.moveTo(player.x+40,y+36);x.lineTo(player.x+51,y+48);x.stroke();let g=x.createLinearGradient(0,y+25,0,y+67);g.addColorStop(0,'#183337');g.addColorStop(1,'#061315');x.fillStyle=g;rr(player.x+9,y+27,35,40,13);x.fill();x.fillStyle='#81d8d0';rr(player.x+19,y+34,15,4,2);x.fill();x.save();x.beginPath();x.arc(cx,y+18,23,0,Math.PI*2);x.clip();if(face.complete&&face.naturalWidth){let s=Math.min(face.naturalWidth,face.naturalHeight),sx=(face.naturalWidth-s)/2,sy=Math.max(0,(face.naturalHeight-s)*.18);x.drawImage(face,sx,sy,s,s,cx-24,y-6,48,48)}else{x.fillStyle='#d6aa8c';x.fillRect(cx-24,y-6,48,48);x.fillStyle='#102022';x.font='bold 22px sans-serif';x.textAlign='center';x.fillText((info.name||'К')[0],cx,y+25)}x.restore();x.strokeStyle='#dffffb';x.lineWidth=2;x.beginPath();x.arc(cx,y+18,23,0,Math.PI*2);x.stroke()}function draw(t){bg();for(let p of plats){let yy=p.y-cam;if(yy<-30||yy>H+30||p.dead)continue;let gr=x.createLinearGradient(0,yy,0,yy+15);gr.addColorStop(0,'#c4fff9');gr.addColorStop(.35,'#81D8D0');gr.addColorStop(1,'#2b8c87');x.shadowColor='#81D8D077';x.shadowBlur=18;x.fillStyle=gr;rr(p.x,yy,p.w,15,8);x.fill();x.shadowBlur=0;if(p.type==='move'){x.fillStyle='#06302f';x.font='bold 11px sans-serif';x.textAlign='center';x.fillText('↔',p.x+p.w/2,yy+11)}if(p.type==='break'){x.strokeStyle='#275f5c';x.beginPath();x.moveTo(p.x+p.w*.45,yy+1);x.lineTo(p.x+p.w*.52,yy+8);x.lineTo(p.x+p.w*.47,yy+14);x.stroke()}}items.forEach(o=>bottle(o,t));dude()}function boost(o){play(burp);$('#boost').textContent=o.t+' БУСТ';$('#boost').classList.add('show');setTimeout(()=>$('#boost').classList.remove('show'),650);if(o.t==='🍺')player.vy=-900;if(o.t==='🍸')player.vy=-1040;if(o.t==='🥃')score+=800;if(o.t==='🌵'){player.vy=-950;player.vx*=1.5}score+=350}function upd(dt,t){let d=diff();if(left)player.vx-=900*dt;if(right)player.vx+=900*dt;if(!left&&!right)player.vx*=Math.pow(.001,dt);player.vx=Math.max(-390,Math.min(390,player.vx));player.x+=player.vx*dt*d.spd;if(player.x<-45)player.x=W;if(player.x>W)player.x=-45;let old=player.y+player.h;player.vy+=d.g*dt*d.spd;player.y+=player.vy*dt*d.spd;let now=player.y+player.h;for(let p of plats){if(p.type==='move')p.x=p.base+Math.sin(t*.0018+p.ph)*40;if(!p.dead&&player.vy>0&&old<=p.y+3&&now>=p.y&&player.x+44>p.x&&player.x+8<p.x+p.w){player.y=p.y-player.h;player.vy=-d.j;score+=100+d.l*10;play(fart);if(p.type==='break')setTimeout(()=>p.dead=1,80);break}}for(let o of items)if(o.on&&Math.hypot(player.x+26-o.x,player.y+35-o.y)<35){o.on=0;boost(o)}if(player.y-cam<H*.39){let oldc=cam;cam=player.y-H*.39;height+=Math.max(0,oldc-cam)*.14;score+=Math.max(0,oldc-cam)*.3}let min=Math.min(...plats.map(p=>p.y));while(min-cam>-150){min-=d.gap+Math.random()*45;add(min)}plats=plats.filter(p=>p.y-cam<H+100);items=items.filter(o=>o.y-cam<H+100&&o.on);$('#score').textContent=Math.floor(score).toLocaleString('ru');$('#height').textContent=Math.floor(height)+' м';if(player.y-cam>H+100){run=0;$('#start').style.display='block';$('#start').textContent='↻ ЕЩЁ РАЗ';return 0}return 1}function loop(t){if(!run)return;let dt=Math.min(.025,(t-last)/1000||.016);last=t;if(upd(dt,t)){draw(t);requestAnimationFrame(loop)}else draw(t)}function hold(id,set){let e=$(id);e.onpointerdown=a=>{a.preventDefault();set(1)};['onpointerup','onpointercancel','onpointerleave'].forEach(k=>e[k]=a=>{a.preventDefault();set(0)})}hold('#L',v=>left=v);hold('#R',v=>right=v);$('#start').onclick=()=>{reset();run=1;last=performance.now();$('#start').style.display='none';requestAnimationFrame(loop)};$('#snd').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇'};face.onload=()=>draw(0);reset();
</script></body></html>
