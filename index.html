<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="КОЛЯГРАМ">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>КОЛЯГРАМ</title>
  <style>
    :root{
      --bg:#FAFAF7;
      --surface:#FFFFFF;
      --surface2:#F5F7F5;
      --text:#172322;
      --muted:#8C9693;
      --line:#E5EAE7;
      --tiffany:#81D8D0;
      --tiffany-dark:#4EBDB4;
      --tiffany-soft:#EAF8F6;
      --mine:#F7FFFE;
      --danger:#B96060;
      --shadow:0 10px 34px rgba(30,70,65,.08);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}
    .screen{display:none;min-height:100vh}
    .screen.active{display:flex;flex-direction:column}
    .brand{
      font-family:"Arial Narrow","Helvetica Neue",sans-serif;
      font-weight:300; letter-spacing:.22em; text-transform:uppercase;
      font-size:30px; line-height:1;
    }
    .brand::first-letter{font-weight:600}
    .microtype{font-family:"Arial Narrow","Helvetica Neue",sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .login{justify-content:center;padding:30px 20px}
    .mark{width:82px;height:82px;border-radius:28px;background:var(--tiffany);
      display:grid;place-items:center;margin-bottom:24px;box-shadow:var(--shadow)}
    .mark svg{width:44px;height:44px}
    .login h1{margin:0 0 10px;font-size:36px}
    .login p{margin:0 0 24px;color:var(--muted);line-height:1.45}
    label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}
    input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 15px;outline:none}
    input:focus,textarea:focus{border-color:var(--tiffany)}
    .primary{border:0;background:var(--tiffany);color:#0E3532;border-radius:18px;min-height:52px;padding:0 18px;font-weight:700}
    .secondary{border:1px solid var(--line);background:#fff;border-radius:16px;min-height:44px;padding:0 14px}
    .login .primary{width:100%;margin-top:20px}
    .hint{margin-top:13px;color:var(--muted);font-size:12px;line-height:1.35}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(250,250,247,.9);backdrop-filter:blur(22px);
      border-bottom:1px solid rgba(229,234,231,.9);padding:10px 12px}
    .toprow{display:flex;align-items:center;gap:10px}
    .circleBtn{width:42px;height:42px;border:1px solid var(--line);background:white;border-radius:15px;display:grid;place-items:center}
    .groupAvatar,.avatar{display:grid;place-items:center;background:var(--tiffany-soft);color:var(--tiffany-dark);font-weight:800}
    .groupAvatar{width:48px;height:48px;border-radius:17px}
    .avatar{width:38px;height:38px;border-radius:14px;flex:none}
    .titleWrap{min-width:0;flex:1}
    .titleMain{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .titleSub{font-size:12px;color:var(--muted);margin-top:2px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
    .tab{border:1px solid var(--line);background:white;border-radius:16px;padding:11px 12px;color:var(--muted)}
    .tab.active{background:var(--tiffany-soft);border-color:#CBEDE9;color:#16423E;font-weight:700}
    .panel{padding:12px}
    .chatList{display:flex;flex-direction:column;gap:8px}
    .chatRow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:white;border-radius:20px;padding:11px 12px;text-align:left}
    .chatRow .body{min-width:0;flex:1}
    .chatRow b{display:block;font-size:15px}
    .chatRow small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .onlineDot{width:9px;height:9px;border-radius:50%;background:var(--tiffany-dark);box-shadow:0 0 0 3px white}
    .messages{flex:1;padding:16px 12px 174px;display:flex;flex-direction:column;gap:12px}
    .dayline{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 6px}
    .msgrow{display:flex;align-items:flex-end;gap:8px}
    .msgrow.mine{justify-content:flex-end}
    .bubble{max-width:82%;border-radius:24px;padding:11px 13px;box-shadow:0 4px 18px rgba(30,60,55,.035)}
    .bubble.other{background:white;border:1px solid var(--line);border-bottom-left-radius:8px}
    .bubble.mine{background:var(--mine);border:1px solid #BFEDE8;border-bottom-right-radius:8px}
    .sender{font-size:12px;font-weight:700;color:var(--tiffany-dark);margin-bottom:4px}
    .msgtext{font-size:17px;line-height:1.36;white-space:pre-wrap;overflow-wrap:anywhere}
    .meta{margin-top:5px;text-align:right;color:var(--muted);font-size:10px}
    .photoBubble{padding:4px}
    .photoBubble img{display:block;width:min(72vw,360px);max-height:430px;object-fit:cover;border-radius:20px}
    .voice{display:flex;align-items:center;gap:10px;min-width:220px}
    .play{width:40px;height:40px;border:0;border-radius:50%;background:var(--tiffany);display:grid;place-items:center}
    .wave{display:flex;align-items:center;gap:2px;flex:1;height:28px}
    .wave i{width:2px;border-radius:9px;background:var(--tiffany-dark)}
    .wave i:nth-child(1){height:7px}.wave i:nth-child(2){height:15px}.wave i:nth-child(3){height:22px}
    .wave i:nth-child(4){height:11px}.wave i:nth-child(5){height:25px}.wave i:nth-child(6){height:17px}
    .wave i:nth-child(7){height:9px}.wave i:nth-child(8){height:21px}.wave i:nth-child(9){height:13px}
    .wave i:nth-child(10){height:24px}.wave i:nth-child(11){height:10px}.wave i:nth-child(12){height:16px}
    .voiceTime{font-size:11px;color:var(--muted)}
    .composerWrap{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
      background:linear-gradient(to top,rgba(250,250,247,1),rgba(250,250,247,.93));border-top:1px solid var(--line)}
    .composerInner{max-width:760px;margin:0 auto}
    .composer{display:grid;grid-template-columns:48px 42px 1fr 52px;gap:7px;align-items:end;background:white;border:1px solid var(--line);
      border-radius:25px;padding:5px;box-shadow:var(--shadow)}
    .galleryBtn,.micBtn,.sendBtn{height:48px;border:0;display:grid;place-items:center}
    .galleryBtn{width:48px;border-radius:18px;background:transparent;color:var(--tiffany-dark)}
    .micBtn,.sendBtn{width:52px;border-radius:19px;background:var(--tiffany);color:#0F3633}
    .sendBtn{display:none}
    .composer textarea{min-height:48px;max-height:112px;border:0;background:transparent;padding:13px 5px;resize:none;font-size:16px}
    .recordBar{display:none;align-items:center;gap:8px;padding:8px 10px 0;color:var(--muted);font-size:12px}
    .recordBar.show{display:flex}
    .pulse{width:8px;height:8px;border-radius:50%;background:#d56666;animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.35}}
    .toast{position:fixed;left:50%;bottom:126px;transform:translateX(-50%);background:#172322;color:white;padding:9px 14px;
      border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
    .toast.show{opacity:1}

    .emojiToggle{width:42px;height:42px;border:1px solid var(--line);background:white;border-radius:15px;display:grid;place-items:center;color:var(--tiffany-dark);font-size:20px}
    .emojiPanel{display:none;position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:30;max-width:740px;margin:0 auto;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:12px}
    .emojiPanel.show{display:block}
    .emojiPanelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .emojiPanelTitle{font-weight:800;letter-spacing:.04em}
    .emojiGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:310px;overflow:auto}
    .emojiPick{aspect-ratio:1;border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:3px;display:grid;place-items:center}
    .emojiPick img{display:block;max-width:100%;max-height:100%;object-fit:contain}
    .stickerMsg{max-width:135px;padding:0;background:transparent;border:0;box-shadow:none}
    .stickerMsg img{display:block;width:120px;height:120px;object-fit:contain}
    .stickerMeta{font-size:10px;color:var(--muted);text-align:right;margin-top:2px}


    .bottomBack{
      position:fixed;
      left:12px;
      bottom:calc(env(safe-area-inset-bottom) + 82px);
      z-index:35;
      width:48px;
      height:48px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(18px);
      border-radius:18px;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
      color:var(--text);
    }
    .versionTag{
      margin-top:14px;
      text-align:center;
      font-size:10px;
      color:var(--muted);
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    html,body{
      overscroll-behavior:none;
      touch-action:manipulation;
      -webkit-text-size-adjust:100%;
    }

    .profileCard{background:white;border:1px solid var(--line);border-radius:22px;padding:16px}
    .profileHero{display:flex;align-items:center;gap:12px}
    .profileHero .avatar{width:58px;height:58px;border-radius:20px;font-size:21px}
    .muted{color:var(--muted)}
  
    .brandLockup{display:flex;align-items:center;gap:10px;min-width:0}
    .brandLogo{width:42px;height:42px;border-radius:13px;object-fit:cover;box-shadow:0 5px 16px rgba(25,190,190,.16);flex:0 0 auto}
    .brandName{
      font-weight:900;font-size:20px;line-height:1;letter-spacing:.045em;
      background:linear-gradient(135deg,#16bfc2 0%,#5de0df 45%,#202b31 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 1px 0 rgba(255,255,255,.55);
    }
    .brandSub{font-size:10px;color:#47bfc0;margin-top:4px;letter-spacing:.04em}
    .profileAvatarWrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 16px}
    .profileAvatar{
      width:92px;height:92px;border-radius:28px;object-fit:cover;background:#eefafa;
      border:1px solid rgba(30,190,190,.24);box-shadow:0 10px 28px rgba(25,160,160,.12)
    }
    .avatarPick{font-size:13px;font-weight:800;color:#179fa2;background:#effafa;border:1px solid #cdeeee;border-radius:14px;padding:9px 13px}
    #avatarInput{display:none}


.loginBrand{justify-content:center;margin:8px 0 20px}
.profileAvatarBox{width:92px;height:92px;position:relative}
.profileAvatarBox .avatar,.profileAvatarBox .profileAvatar{width:92px;height:92px;border-radius:28px}
.brandName{font-size:22px!important;letter-spacing:.16em!important;background:linear-gradient(135deg,#0aaeb2,#68dedc 55%,#178d91)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;text-shadow:none!important}


.recordingBar{
  display:none;align-items:center;gap:10px;position:fixed;left:12px;right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:60;padding:10px 12px;
  background:rgba(255,247,247,.98);border:1px solid rgba(220,50,50,.25);
  border-radius:20px;box-shadow:0 12px 35px rgba(140,20,20,.16);backdrop-filter:blur(18px)
}
.recordingBar.show{display:flex}
.recordDot{width:10px;height:10px;border-radius:50%;background:#e53935;box-shadow:0 0 0 5px rgba(229,57,53,.12);animation:recpulse 1s infinite}
@keyframes recpulse{50%{opacity:.45;transform:scale(.85)}}
.recordingText{font-weight:900;color:#d62f2f;flex:1}
.recordingTime{font-variant-numeric:tabular-nums;color:#9b3333;font-weight:800}
.cancelRecord{width:42px;height:42px;border:0;border-radius:14px;background:#e53935;color:white;font-size:24px;line-height:1}
body.isRecording #mic{background:#e53935!important;color:#fff!important}


.recordingBar{
  display:none!important;
  align-items:center!important;
  gap:10px!important;
  padding:8px 10px!important;
}
.recordingBar.show{display:flex!important}
.recordCenter{min-width:0;flex:1;display:flex;align-items:center;justify-content:center;gap:10px}
.recordAction{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:15px;font-size:23px;font-weight:900;display:grid;place-items:center}
.cancelRecord{background:#ef4444!important;color:#fff!important}
.sendRecord{background:#22bfc1;color:#fff}
.voiceWave{height:25px;display:flex;align-items:center;gap:3px;overflow:hidden}
.voiceWave i{display:block;width:3px;border-radius:5px;background:#e53935;animation:wave .8s ease-in-out infinite}
.voiceWave i:nth-child(1){height:8px}.voiceWave i:nth-child(2){height:17px;animation-delay:.12s}
.voiceWave i:nth-child(3){height:24px;animation-delay:.24s}.voiceWave i:nth-child(4){height:14px;animation-delay:.36s}
.voiceWave i:nth-child(5){height:9px;animation-delay:.48s}
@keyframes wave{50%{transform:scaleY(.45);opacity:.55}}
body.isRecording .composer>*{visibility:hidden}
body.isRecording #recordingBar,body.isRecording #recordingBar *{visibility:visible}
.voiceSpeed{
  border:0;background:rgba(20,175,178,.12);color:#148f92;border-radius:10px;
  min-width:38px;height:28px;padding:0 7px;font-weight:900;font-size:12px;margin-left:6px
}


/* v6.5 custom voice player */
.voicePlayer{display:flex;align-items:center;gap:8px;min-width:230px;max-width:100%}
.voicePlay{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#20b9bc;color:white;font-size:16px;font-weight:900}
.voiceSeek{min-width:90px;flex:1;accent-color:#20b9bc}
.voiceClock{font-size:11px;font-weight:800;min-width:68px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.voiceSpeed{flex:0 0 auto!important;margin-left:0!important}
.voiceNativeHidden{display:none!important}


/* v6.6 real voice player: attaches to rendered data-voice-url messages */
.voiceV66{display:flex!important;align-items:center!important;gap:10px!important;min-width:255px!important}
.voicePlayV66{width:46px!important;height:46px!important;flex:0 0 46px!important;border:0!important;border-radius:50%!important;background:#8ed8d5!important;color:#102c2c!important;font-size:17px!important;font-weight:900!important}
.voiceBodyV66{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.voiceSeekV66{display:block;width:100%;height:20px;margin:0;accent-color:#62c4c0}
.voiceInfoV66{display:flex;align-items:center;justify-content:space-between;gap:8px}
.voiceClockV66{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.voiceSpeedV66{border:0;border-radius:9px;padding:4px 8px;background:rgba(98,196,192,.14);color:#278e8a;font-size:12px;font-weight:900}


.serverAvatar{object-fit:cover!important;padding:0!important}


.profileEditBlock{margin:12px 0 4px}
.profileNameRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.profileNameRow input{min-width:0;margin:0}
.profileSaveBtn{min-height:48px!important;padding:0 14px!important;border-radius:16px!important}


.serverAvatar{object-fit:cover!important;padding:0!important}
.deliveryState{display:inline-flex;align-items:center;gap:2px;margin-left:4px;font-weight:900}
.deliveryState.sent{color:#9aa6aa}
.deliveryState.delivered{color:#58aaa8}
.deliveryState.read{color:#14b8b8}
.unreadBadge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#18b7b9;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}


/* v7.6: стабильный рендер без моргания */
.photoMessage{cursor:pointer}
.photoViewer{
  display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);
  align-items:center;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
}
.photoViewer.show{display:flex}
.photoViewerImg{max-width:100%;max-height:78vh;object-fit:contain;border-radius:14px}
.photoViewerTop{
  position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.photoViewerBtn{
  border:0;border-radius:14px;min-width:46px;height:46px;padding:0 14px;
  background:rgba(255,255,255,.94);color:#111;font-weight:900;font-size:15px
}
.photoViewerActions{
  position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);
  left:12px;right:12px;display:flex;justify-content:center;gap:10px
}

</style>
</head>
<body>
<div class="app">
  <section id="login" class="screen login active">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="#103B37" stroke-width="3">
        <path d="M16 22h32v20H29l-9 8v-8h-4z"/>
        <path d="M24 30h16M24 36h10"/>
      </svg>
    </div>
    <div class="brandLockup loginBrand"><img class="brandLogo" src="./kolyagram-logo.jpg" alt=""><div class="brandName">КОЛЯГРАМ</div></div>
    <p>Закрытый мессенджер для своих. Крупно, чисто и без лишней хуйни.</p>

    <label for="code">Код приглашения</label>
    <input id="code" placeholder="Введите код" autocomplete="one-time-code">

    <label for="name">Имя</label>
    <input id="name" placeholder="Колян" autocomplete="nickname">

    <label for="avatarTextInput">Буква или эмодзи для аватара</label>
    <input id="avatarTextInput" maxlength="4" value="К">

    <button id="join" class="primary">Войти</button>
<div id="serverError" style="display:none;margin:10px 0 0;padding:12px 14px;border-radius:16px;background:#fff0f0;border:1px solid #ffcaca;color:#9f2020;font-size:13px;line-height:1.4;word-break:break-word"></div>

    
  </section>

  <section id="home" class="screen">
    <header class="topbar">
      <div class="toprow">
        <div class="groupAvatar">Б</div>
        <div class="titleWrap">
          <div class="brandLockup"><img class="brandLogo" src="./kolyagram-logo.jpg" alt=""><div class="brandName">КОЛЯГРАМ</div></div><div id="mode" style="display:none"></div>
        </div>
        

<button id="toggleBackgroundMusic" class="secondary" type="button" style="width:100%;margin-top:10px">🎵 Фоновая музыка: Вкл</button>

<button id="testMessageSound" class="secondary" type="button" style="width:100%;margin-top:10px">🎮 Проверить звук Dota</button>

<button id="logout" class="circleBtn" aria-label="Выйти">↪</button>
      </div>
    </header>

    <div class="tabs">
      <button id="tabChats" class="tab active">Чаты</button>
      <button id="tabProfile" class="tab">Профиль</button>
    </div>

    <div id="chatsPanel" class="panel">
      <div class="chatList">
        <button class="chatRow" data-chat="group">
          <div class="groupAvatar">Б</div>
          <div class="body"><b>Общий чат</b><small id="groupPreview">Все свои здесь</small></div>
          <span class="onlineDot"></span>
        </button>
        <div id="people"></div>
      </div>
    </div>

    <div id="profilePanel" class="panel" style="display:none">
      <div class="profileCard">
        <div class="profileHero">
          <div class="profileAvatarBox">
  <div id="profileAvatarFallback" class="avatar">К</div>
  <img id="profileAvatarImage" class="profileAvatar" alt="Аватар" style="display:none">
</div>
          <div><b id="profileName">Колян</b><div class="muted" style="margin-top:4px;font-size:13px">участник Банды</div></div>
        </div>
        <div style="height:12px"></div>
        
<div class="profileEditBlock">
  <label for="profileNameInput">Имя</label>
  <div class="profileNameRow">
    <input id="profileNameInput" type="text" maxlength="32" placeholder="Имя">
    <button id="saveProfileName" class="primary profileSaveBtn" type="button">Сохранить</button>
  </div>
</div>

<input id="avatarPhotoInput" type="file" accept="image/*" style="display:none">
<label for="avatarPhotoInput" class="avatarPick" style="display:block;text-align:center;margin:12px 0 10px">Выбрать фото для аватарки</label>
<button id="removeAvatarPhoto" class="secondary" style="width:100%;display:none;margin-bottom:10px">Удалить фото</button>
<button id="copyInvite" class="secondary" style="width:100%">Показать код приглашения</button><div class="versionTag">КОЛЯГРАМ v7.9</div>
      </div>
    </div>
  </section>

  <section id="chat" class="screen">
    <header class="topbar">
      <div class="toprow">

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

const $=s=>document.querySelector(s);
const READY=SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes("PASTE_");
const supabase=READY?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const LOCAL_MESSAGES="kolyagram.messages.v7";
const LOCAL_USERS="kolyagram.users.v7";
let me=JSON.parse(localStorage.getItem("kolyagram.me")||"null");
let currentChat={type:"group",id:null,name:"Общий чат",avatar:"Б",avatar_url:null};
let recorder=null,chunks=[],stream=null,recordStarted=0,timer=null;

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1700)}

function showServerError(stage,error){
  const el=$("#serverError");
  const msg=error?.message || String(error || "Неизвестная ошибка");
  const code=error?.code ? ` [${error.code}]` : "";
  const status=error?.status ? ` HTTP ${error.status}` : "";
  const details=error?.details ? `\n${error.details}` : "";
  if(el){
    el.style.display="block";
    el.textContent=`${stage}: ${msg}${code}${status}${details}`;
  }
  toast("Ошибка сервера");
}
function clearServerError(){
  const el=$("#serverError");
  if(el){el.style.display="none";el.textContent="";}
}

function show(id){["login","home","chat"].forEach(x=>$("#"+x).classList.toggle("active",x===id))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmtTime(d){return new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit"}).format(new Date(d))}
function uuid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}

async function ensureAuth(){
  if(!READY){
    showServerError("Конфигурация","Supabase URL или publishable key не загружены");
    return false;
  }
  clearServerError();
  try{
    const {data:{session},error:sessionError}=await supabase.auth.getSession();
    if(sessionError){showServerError("Проверка сессии",sessionError);return false}
    if(session)return true;

    const {data,error}=await supabase.auth.signInAnonymously();
    if(error){showServerError("Анонимный вход",error);return false}
    if(!data?.user){showServerError("Анонимный вход","Supabase не вернул пользователя");return false}
    return true;
  }catch(e){
    showServerError("Анонимный вход",e);
    return false;
  }
}
async function currentAuthId(){
  if(!READY)return me?.local_id||null;
  const {data:{user}}=await supabase.auth.getUser();
  return user?.id||null;
}
async function validCode(code){
  if(!READY)return false;
  const {data,error}=await supabase.from("invite_codes").select("code").eq("code",code.trim()).eq("active",true).maybeSingle();
  if(error){showServerError("Проверка кода приглашения",error);return false}
  return !!data;
}
async function upsertProfile(){
  if(!READY){
    let users=JSON.parse(localStorage.getItem(LOCAL_USERS)||"[]");
    if(!users.some(u=>u.id===me.local_id))users.push({id:me.local_id,name:me.name,avatar:me.avatar});
    localStorage.setItem(LOCAL_USERS,JSON.stringify(users));
    return true;
  }
  const id=await currentAuthId();
  if(!id){showServerError("Профиль","Не получен id пользователя");return false}
  const {error}=await supabase.from("profiles").upsert({id,display_name:me.name,avatar:me.avatar,avatar_url:me.avatar_url||null,updated_at:new Date().toISOString()});
  if(error){showServerError("Сохранение профиля",error);return false}
  return true;
}
$("#join").addEventListener("click",async()=>{
  clearServerError();
  const code=$("#code").value.trim(),name=$("#name").value.trim(),avatar=$("#avatarTextInput").value.trim()||"🙂";
  if(!code||!name){toast("Нужны код и имя");return}
  if(!(await ensureAuth()))return;

  const okCode=await validCode(code);
  if(!okCode){
    if($("#serverError")?.style.display!=="block")toast("Код не подходит");
    return;
  }

  const id=await currentAuthId();
  if(!id){showServerError("Вход","Не удалось получить id пользователя");return}
  me={name,avatar,code,local_id:id};
  localStorage.setItem("kolyagram.me",JSON.stringify(me));

  if(!(await upsertProfile())){
    localStorage.removeItem("kolyagram.me");
    me=null;
    return;
  }
  await requestKolyagramNotifications();
  await enterHome();
});
$("#logout").addEventListener("click",()=>{localStorage.removeItem("kolyagram.me");me=null;show("login")});

async function loadPeople(){
  let users=[];
  if(READY){
    const myid=await currentAuthId();
    window.KOLYA_MY_ID=myid;
    const {data}=await supabase.from("profiles").select("id,display_name,avatar,avatar_url,updated_at").neq("id",myid).order("display_name");
    users=(data||[]).map(x=>({id:x.id,name:x.display_name,avatar:x.avatar||"🙂",avatar_url:x.avatar_url||null}));

    const {data:recent}=await supabase.from("messages")
      .select("id,sender_id,recipient_id,kind,text,created_at,read_at")
      .or(`sender_id.eq.${myid},recipient_id.eq.${myid}`)
      .order("created_at",{ascending:false})
      .limit(500);
    const rows=recent||[];
    users.forEach(u=>{
      const msgs=rows.filter(m=>
        (m.sender_id===myid && m.recipient_id===u.id) ||
        (m.sender_id===u.id && m.recipient_id===myid)
      );
      u.last=msgs[0]||null;
      u.unread=msgs.filter(m=>m.sender_id===u.id && m.recipient_id===myid && !m.read_at).length;
    });
  }else{
    users=JSON.parse(localStorage.getItem(LOCAL_USERS)||"[]").filter(x=>x.id!==me.local_id);
  }

  const sig=kolyaSignature(users.map(u=>({
    id:u.id,name:u.name,avatar:u.avatar,avatar_url:u.avatar_url,
    last:u.last?{id:u.last.id,kind:u.last.kind,text:u.last.text,created_at:u.last.created_at,read_at:u.last.read_at}:null,
    unread:u.unread||0
  })));
  if(sig===kolyaPeopleSignature)return;
  kolyaPeopleSignature=sig;

  const preview=m=>{
    if(!m)return "Личный чат";
    if(m.kind==="voice")return "🎤 Голосовое сообщение";
    if(m.kind==="photo")return "📷 Фото";
    if(m.kind==="sticker")return "🙂 Стикер";
    return (m.text||"Сообщение").slice(0,42);
  };
  const tm=m=>m?.created_at?new Date(m.created_at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"";

  $("#people").innerHTML=users.map(u=>`
    <button class="chatRow" data-person="${esc(u.id)}" data-name="${esc(u.name)}" data-avatar="${esc(u.avatar)}" data-avatar-url="${esc(u.avatar_url||"")}" style="margin-top:8px;width:100%">
      ${u.avatar_url?`<img class="avatar serverAvatar" src="${esc(u.avatar_url)}" alt="">`:`<div class="avatar">${esc(u.avatar)}</div>`}
      <div class="body"><b>${esc(u.name)}</b><small>${esc(preview(u.last))}</small></div>
      <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <small style="font-size:11px">${esc(tm(u.last))}</small>
        ${u.unread?`<span class="unreadBadge">${u.unread>99?"99+":u.unread}</span>`:`<span class="onlineDot"></span>`}
      </div>
    </button>`).join("");
  document.querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click",()=>openChat("direct",b.dataset.person,b.dataset.name,b.dataset.avatar,b.dataset.avatarUrl||null)));
}
async function enterHome(){
  show("home");
  if($("#mode"))$("#mode").textContent=READY?"онлайн":"";
  $("#profileName").textContent=me.name;$("#profileAvatarFallback").textContent=me.avatar;if($("#profileNameInput"))$("#profileNameInput").value=me.name;
  await loadPeople();
  await startRealtime();
}
$("#tabChats").addEventListener("click",()=>{$("#tabChats").classList.add("active");$("#tabProfile").classList.remove("active");$("#chatsPanel").style.display="block";$("#profilePanel").style.display="none"});
$("#tabProfile").addEventListener("click",()=>{$("#tabProfile").classList.add("active");$("#tabChats").classList.remove("active");$("#chatsPanel").style.display="none";$("#profilePanel").style.display="block"});
$("#copyInvite").addEventListener("click",()=>toast("Код: "+me.code));
document.querySelector('[data-chat="group"]').addEventListener("click",()=>openChat("group",null,"Общий чат","Б"));
$("#back").addEventListener("click",enterHome);

async function openChat(type,id,name,avatar,avatar_url=null){
  currentChat={type,id,name,avatar,avatar_url}; show("chat");
  $("#chatTitle").textContent=name;
  const ca=$("#chatAvatar");
  if(avatar_url){
    ca.innerHTML=`<img src="${esc(avatar_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" alt="">`;
  }else ca.textContent=avatar;
  $("#chatSub").textContent=type==="group"?"свои на связи":"личный чат";
  await loadMessages();
}
function localAll(){return JSON.parse(localStorage.getItem(LOCAL_MESSAGES)||"[]")}
function saveLocal(a){localStorage.setItem(LOCAL_MESSAGES,JSON.stringify(a))}
function belongsLocal(m){
  if(currentChat.type==="group")return m.room==="group";
  return m.room==="direct" && [m.sender_id,m.recipient_id].includes(me.local_id) &&
    [m.sender_id,m.recipient_id].includes(currentChat.id);
}
async function fetchMessages(){
  if(!READY)return localAll().filter(belongsLocal);
  const myid=await currentAuthId();
  let q=supabase.from("messages").select("*").order("created_at",{ascending:true}).limit(300);
  if(currentChat.type==="group") q=q.is("recipient_id",null);
  else q=q.or(`and(sender_id.eq.${myid},recipient_id.eq.${currentChat.id}),and(sender_id.eq.${currentChat.id},recipient_id.eq.${myid})`);
  const {data}=await q;
  const rows=data||[];
  const ids=[...new Set(rows.map(x=>x.sender_id).filter(Boolean))];
  if(ids.length){
    const {data:profiles}=await supabase.from("profiles").select("id,display_name,avatar_url").in("id",ids);
    const pmap=Object.fromEntries((profiles||[]).map(x=>[x.id,{name:x.display_name,avatar_url:x.avatar_url}]));
    rows.forEach(x=>{
      x.sender_avatar_url=pmap[x.sender_id]?.avatar_url||null;
      x.sender_profile_name=pmap[x.sender_id]?.name||x.sender_name;
    });
  }
  return rows;
}
function wave(){return '<div class="wave">'+Array.from({length:12},()=>'<i></i>').join("")+'</div>'}
function msgHTML(m){
  const mine=(m.sender_id===window.KOLYA_MY_ID);
  const avatar=m.sender_avatar||m.sender_name?.[0]||"•";
  let content="";
  if(m.kind==="photo"&&m.media_url)content=`<div class="bubble ${mine?"mine":"other"} photoBubble"><img src="${esc(m.media_url)}" alt="Фото" class="photoMessage" data-full-photo="${esc(m.media_url)}"><div class="meta">${fmtTime(m.created_at)}${deliveryHTML(m,mine)}</div></div>`;
  else if(m.kind==="voice"&&m.media_url)content=`<div class="bubble ${mine?"mine":"other"}"><div class="voice voiceV66" data-voice-url="${esc(m.media_url)}"><button class="play voicePlayV66" type="button">▶</button><div class="voiceBodyV66"><input class="voiceSeekV66" type="range" min="0" max="1000" value="0" step="1"><div class="voiceInfoV66"><span class="voiceClockV66">00:00 / --:--</span><button class="voiceSpeedV66" type="button">1×</button></div></div></div><div class="meta">${fmtTime(m.created_at)}${deliveryHTML(m,mine)}</div></div>`;
  else if(m.kind==="sticker"&&m.media_url)content=`<div class="stickerMsg"><img src="${esc(m.media_url)}" alt="Эмодзи БАНДЫ" class="photoMessage" data-full-photo="${esc(m.media_url)}"><div class="stickerMeta">${fmtTime(m.created_at)}${deliveryHTML(m,mine)}</div></div>`;
  else content=`<div class="bubble ${mine?"mine":"other"}">${mine?"":`<div class="sender">${esc(m.sender_profile_name||m.sender_name)}</div>`}<div class="msgtext">${esc(m.text)}</div><div class="meta">${fmtTime(m.created_at)}${deliveryHTML(m,mine)}</div></div>`;
  return `<div class="msgrow ${mine?"mine":""}">${mine?"":(m.sender_avatar_url?`<img class="avatar serverAvatar" src="${esc(m.sender_avatar_url)}" alt="">`:`<div class="avatar">${esc(avatar)}</div>`)}${content}</div>`;
}
async function loadMessages(){
  if(READY && !window.KOLYA_MY_ID) window.KOLYA_MY_ID=await currentAuthId();
  const arr=await fetchMessages();
  const sig=kolyaSignature(arr.map(m=>({
    id:m.id,sender_id:m.sender_id,kind:m.kind,text:m.text,media_url:m.media_url,
    created_at:m.created_at,delivered_at:m.delivered_at,read_at:m.read_at,
    sender_profile_name:m.sender_profile_name,sender_avatar_url:m.sender_avatar_url
  })));

  if(sig!==kolyaMessagesSignature){
    kolyaMessagesSignature=sig;
    $("#messages").innerHTML='<div class="dayline">Сегодня</div>'+arr.map(msgHTML).join("");
    bindPhotoViewer($("#messages"));
    const box=$("#messages");
    if(box)box.scrollTop=box.scrollHeight;
  }
  if(READY) await markVisibleMessages();
}
async function baseMessage(kind,text="",url=null){
  const sender_id=await currentAuthId()||me.local_id;
  return {
    sender_id,sender_name:me.name,sender_avatar:me.avatar,
    recipient_id:currentChat.type==="direct"?currentChat.id:null,
    kind,text,media_url:url,created_at:new Date().toISOString(),
    room:currentChat.type==="group"?"group":"direct"
  };
}
async function insertMessage(obj){
  if(READY){const {error}=await supabase.from("messages").insert({
    sender_id:obj.sender_id,sender_name:obj.sender_name,sender_avatar:obj.sender_avatar,
    recipient_id:obj.recipient_id,kind:obj.kind,text:obj.text,media_url:obj.media_url,created_at:obj.created_at
  }); if(error){toast("Не отправилось");return}}
  else {let arr=localAll();arr.push({...obj,id:uuid()});saveLocal(arr)}
  await loadMessages();
}
async function sendText(){
  const text=$("#message").value.trim();if(!text)return;
  $("#message").value="";toggleComposer();
  await insertMessage(await baseMessage("text",text,null));
}
$("#send").addEventListener("click",sendText);
$("#message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}});
$("#message").addEventListener("input",toggleComposer);
function toggleComposer(){
  const has=$("#message").value.trim().length>0;
  $("#mic").style.display=has?"none":"grid";$("#send").style.display=has?"grid":"none";
}

$("#gallery").addEventListener("click",()=>$("#fileInput").click());
$("#fileInput").addEventListener("change",async()=>{
  const f=$("#fileInput").files?.[0];if(!f)return;
  if(READY){
    const ext=(f.name.split(".").pop()||"jpg").toLowerCase();
    const path=`photos/${uuid()}.${ext}`;
    const {error}=await supabase.storage.from("media").upload(path,f,{contentType:f.type||"image/jpeg"});
    if(error){toast("Фото не загрузилось");return}
    const {data}=supabase.storage.from("media").getPublicUrl(path);
    await insertMessage(await baseMessage("photo","",data.publicUrl));
  }else{
    const url=URL.createObjectURL(f);
    await insertMessage(await baseMessage("photo","",url));
    toast("В демо фото исчезнет после перезапуска");
  }
  $("#fileInput").value="";
});

$("#mic").addEventListener("click",async()=>{
  if(recorder?.state==="recording"){recorder.stop();return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const type=MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"audio/webm";
    chunks=[];recorder=new MediaRecorder(stream,{mimeType:type});
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=async()=>{ if(kolyaCancelRecording){kolyaCancelRecording=false;kolyaHideRecording(false);return;} kolyaHideRecording(true);
      clearInterval(timer);$("#recordBar").classList.remove("show");stream?.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type});
      if(READY){
        const ext=type.includes("mp4")?"m4a":"webm",path=`voice/${uuid()}.${ext}`;
        const {error}=await supabase.storage.from("media").upload(path,blob,{contentType:type});
        if(error){toast("Голосовое не загрузилось");return}
        const {data}=supabase.storage.from("media").getPublicUrl(path);
        await insertMessage(await baseMessage("voice","",data.publicUrl));
      }else{
        const url=URL.createObjectURL(blob);
        await insertMessage(await baseMessage("voice","",url));
        toast("Демо-голосовое живёт до перезапуска");
      }
    };
    recorder.start(); kolyaShowRecording();recordStarted=Date.now();$("#recordBar").classList.add("show");
    timer=setInterval(()=>{const s=Math.floor((Date.now()-recordStarted)/1000);$("#recordText").textContent=`Запись голосового · ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} · нажми ещё раз для отправки`},500);
  }catch(e){toast("Разреши микрофон")}
});

const КОЛЯГРАМ_EMOJIS = ["./egypt_01.png", "./egypt_02.png", "./egypt_03.png", "./egypt_04.png", "./egypt_05.png", "./egypt_06.png", "./egypt_07.png", "./egypt_08.png", "./egypt_09.png", "./egypt_10.png", "./egypt_11.png", "./egypt_12.png", "./egypt_13.png", "./egypt_14.png", "./egypt_15.png", "./egypt_16.png", "./egypt_17.png", "./egypt_18.png"];
function renderBandaEmojis(){
  $("#emojiGrid").innerHTML=КОЛЯГРАМ_EMOJIS.map(src=>`<button class="emojiPick" data-sticker="${src}"><img src="${src}" alt="Эмодзи"></button>`).join("");
  document.querySelectorAll("[data-sticker]").forEach(b=>b.addEventListener("click",async()=>{
    $("#emojiPanel").classList.remove("show");
    await insertMessage(await baseMessage("sticker","",b.dataset.sticker));
  }));

(function(){
  const input=document.getElementById("avatarPhotoInput");
  const image=document.getElementById("profileAvatarImage");
  const fallback=document.getElementById("profileAvatarFallback");
  const removeBtn=document.getElementById("removeAvatarPhoto");
  if(!input || !image || !fallback) return;

  function showAvatar(data){
    if(data){
      image.src=data;
      image.style.display="block";
      fallback.style.display="none";
      if(removeBtn) removeBtn.style.display="block";
    }else{
      image.removeAttribute("src");
      image.style.display="none";
      fallback.style.display="flex";
      if(removeBtn) removeBtn.style.display="none";
    }
  }

  showAvatar(me?.avatar_url || localStorage.getItem("kolyagram_avatar_photo"));

  input.addEventListener("change", async function(){
    const file=this.files && this.files[0];
    if(!file) return;

    // Сначала показываем локально, чтобы не ждать сеть.
    const reader=new FileReader();
    reader.onload=function(){ showAvatar(reader.result); };
    reader.readAsDataURL(file);

    if(READY){
      const uid=await currentAuthId();
      if(!uid){toast("Нет пользователя");return}
      const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
      const path=`avatars/${uid}-${Date.now()}.${ext}`;
      const {error}=await supabase.storage.from("media").upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});
      if(error){toast("Аватар не загрузился");return}
      const {data}=supabase.storage.from("media").getPublicUrl(path);
      me.avatar_url=data.publicUrl;
      localStorage.setItem("kolyagram.me",JSON.stringify(me));
      await supabase.from("profiles").update({avatar_url:me.avatar_url,updated_at:new Date().toISOString()}).eq("id",uid);
      showAvatar(me.avatar_url);
      toast("Аватар обновлён");
      await loadPeople();
    }else{
      try{ localStorage.setItem("kolyagram_avatar_photo",reader.result||""); }catch(e){}
    }
  });

  if(removeBtn) removeBtn.addEventListener("click", function(){
    localStorage.removeItem("kolyagram_avatar_photo");
    if(me){me.avatar_url=null;localStorage.setItem("kolyagram.me",JSON.stringify(me));}
    if(READY){
      currentAuthId().then(uid=>uid&&supabase.from("profiles").update({avatar_url:null,updated_at:new Date().toISOString()}).eq("id",uid));
    }
    input.value="";
    showAvatar(null);
  });
})();


let kolyaRecordingTimer=null, kolyaRecordingStarted=0, kolyaCancelRecording=false;
function kolyaPlay(id){
  const a=document.getElementById(id);
  if(!a)return;
  try{a.currentTime=0; const p=a.play(); if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
function kolyaShowRecording(){
  kolyaCancelRecording=false;
  kolyaRecordingStarted=Date.now();
  document.body.classList.add("isRecording");
  const bar=document.getElementById("recordingBar");
  if(bar)bar.classList.add("show");
  kolyaPlay("recordStartSound");
  clearInterval(kolyaRecordingTimer);
  kolyaRecordingTimer=setInterval(()=>{
    const el=document.getElementById("recordingTime"); if(!el)return;
    const sec=Math.floor((Date.now()-kolyaRecordingStarted)/1000);
    el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  },250);
}
function kolyaHideRecording(playStop=true){
  document.body.classList.remove("isRecording");
  const bar=document.getElementById("recordingBar");
  if(bar)bar.classList.remove("show");
  clearInterval(kolyaRecordingTimer);
  kolyaRecordingTimer=null;
  if(playStop)kolyaPlay("recordStopSound");
}

  try{ if(typeof recorder!=="undefined" && recorder && recorder.state!=="inactive") recorder.stop(); }catch(e){}

    }

/* v6.6: one persistent Audio object per rendered voice message */
let kolyaActiveVoice=null;

function kfmtVoice(sec){
  if(!Number.isFinite(sec)||sec<0)return "--:--";
  sec=Math.floor(sec);
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function initVoicePlayers(){
  document.querySelectorAll(".voiceV66[data-voice-url]").forEach(box=>{
    if(box.dataset.ready==="1")return;
    box.dataset.ready="1";
    const play=box.querySelector(".voicePlayV66");
    const seek=box.querySelector(".voiceSeekV66");
    const clock=box.querySelector(".voiceClockV66");
    const speed=box.querySelector(".voiceSpeedV66");
    const audio=new Audio(box.dataset.voiceUrl);
    audio.preload="metadata";
    box._audio=audio;
    let dragging=false, speeds=[1,2,3], speedIndex=0;

    const refresh=()=>{
      const d=audio.duration,c=audio.currentTime||0;
      if(!dragging && Number.isFinite(d)&&d>0)seek.value=Math.round(c/d*1000);
      clock.textContent=kfmtVoice(c)+" / "+kfmtVoice(d);
      play.textContent=audio.paused?"▶":"❚❚";
    };
    audio.addEventListener("loadedmetadata",refresh);
    audio.addEventListener("durationchange",refresh);
    audio.addEventListener("timeupdate",refresh);
    audio.addEventListener("pause",refresh);
    audio.addEventListener("play",()=>{
      if(kolyaActiveVoice && kolyaActiveVoice!==audio)kolyaActiveVoice.pause();
      kolyaActiveVoice=audio; refresh();
    });
    audio.addEventListener("ended",()=>{audio.currentTime=0;refresh();});

    play.addEventListener("click",e=>{
      e.preventDefault();e.stopPropagation();
      if(audio.paused)audio.play().catch(()=>{});
      else audio.pause();
    });
    seek.addEventListener("input",()=>{
      dragging=true;
      const d=audio.duration;
      if(Number.isFinite(d)&&d>0)clock.textContent=kfmtVoice(Number(seek.value)/1000*d)+" / "+kfmtVoice(d);
    });
    seek.addEventListener("change",()=>{
      const d=audio.duration;
      if(Number.isFinite(d)&&d>0)audio.currentTime=Number(seek.value)/1000*d;
      dragging=false;refresh();
    });
    speed.addEventListener("click",e=>{
      e.preventDefault();e.stopPropagation();
      speedIndex=(speedIndex+1)%speeds.length;
      audio.playbackRate=speeds[speedIndex];
      speed.textContent=speeds[speedIndex]+"×";
    });
    refresh();
  });
}
new MutationObserver(()=>initVoicePlayers()).observe(document.getElementById("messages")||document.body,{childList:true,subtree:true});
initVoicePlayers();

    const {error}=await supabase.from("profiles")
      .update({display_name:newName,updated_at:new Date().toISOString()})
      .eq("id",uid);

});


function deliveryHTML(m,mine){
  if(!mine)return "";
  if(m.read_at)return `<span class="deliveryState read" title="Прочитано">✓✓</span>`;
  if(m.delivered_at)return `<span class="deliveryState delivered" title="Доставлено">✓✓</span>`;
  return `<span class="deliveryState sent" title="Отправлено">✓</span>`;
}

async function markVisibleMessages(){
  if(!READY || !me)return;
  const myid=await currentAuthId();
  if(!myid)return;
  const now=new Date().toISOString();

  // Все видимые входящие считаем доставленными.
  let q=supabase.from("messages")
    .update({delivered_at:now})
    .neq("sender_id",myid)
    .is("delivered_at",null);

  if(currentChat.type==="group") q=q.is("recipient_id",null);
  else q=q.eq("sender_id",currentChat.id).eq("recipient_id",myid);
  await q;

  // Если сам чат открыт, входящие считаем прочитанными.
  if(document.getElementById("chat")?.classList.contains("active")){
    let r=supabase.from("messages")
      .update({read_at:now,delivered_at:now})
      .neq("sender_id",myid)
      .is("read_at",null);

    if(currentChat.type==="group") r=r.is("recipient_id",null);
    else r=r.eq("sender_id",currentChat.id).eq("recipient_id",myid);
    await r;
  }
}

  try{

}


let kolyaRealtimeChannel=null;
let kolyaPollTimer=null;
async function startRealtime(){
  if(!READY)return;
  const myid=await currentAuthId();
  if(!myid)return;
  window.KOLYA_MY_ID=myid;

  if(!kolyaRealtimeChannel){
    kolyaRealtimeChannel=supabase.channel("kolyagram-v75-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"messages"},async payload=>{
        const m=payload.new||payload.old||{};
        if(payload.eventType==="INSERT" && m.sender_id && m.sender_id!==myid){
          playIncomingOnce(m);
          showIncomingNotification(m);
        }
        await loadPeople();
        if(document.getElementById("chat")?.classList.contains("active")) await loadMessages();
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},async()=>{
        await loadPeople();
        if(document.getElementById("chat")?.classList.contains("active")) await loadMessages();
      })
      .subscribe(status=>{
        window.KOLYA_RT_STATUS=status;
      });
  }

  // Надёжный запасной канал для iPhone/PWA: если websocket уснул,
  // открытый чат всё равно обновляется без выхода.
  if(!kolyaPollTimer){
    kolyaPollTimer=setInterval(async()=>{
      if(document.visibilityState!=="visible")return;
      try{
        await loadPeople();
        if(document.getElementById("chat")?.classList.contains("active")) await loadMessages();
      }catch(e){}
    },2200);
  }
}

function bindPhotoViewer(root=document){
  root.querySelectorAll?.(".photoMessage[data-full-photo]").forEach(img=>{
    if(img.dataset.viewerBound==="1")return;
    img.dataset.viewerBound="1";
    img.addEventListener("click",()=>{
      const viewer=document.getElementById("photoViewer");
      const full=document.getElementById("photoViewerImg");
      if(!viewer||!full)return;
      full.src=img.dataset.fullPhoto;
      viewer.dataset.url=img.dataset.fullPhoto;
      viewer.classList.add("show");
      viewer.setAttribute("aria-hidden","false");
    });
  });
}
function closePhotoViewer(){
  const viewer=document.getElementById("photoViewer");
  const full=document.getElementById("photoViewerImg");
  if(viewer){viewer.classList.remove("show");viewer.setAttribute("aria-hidden","true");viewer.dataset.url="";}
  if(full)full.removeAttribute("src");
}
document.getElementById("closePhotoViewer")?.addEventListener("click",closePhotoViewer);
document.getElementById("photoViewer")?.addEventListener("click",e=>{
  if(e.target?.id==="photoViewer")closePhotoViewer();
});

async function currentPhotoFile(){
  const url=document.getElementById("photoViewer")?.dataset.url;
  if(!url)return null;
  const res=await fetch(url);
  if(!res.ok)throw new Error("Фото не загрузилось");
  const blob=await res.blob();
  const type=blob.type||"image/jpeg";
  const ext=type.includes("png")?"png":type.includes("webp")?"webp":"jpg";
  return {url,blob,file:new File([blob],`kolyagram-${Date.now()}.${ext}`,{type})};
}
document.getElementById("sharePhotoViewer")?.addEventListener("click",async()=>{
  try{
    const x=await currentPhotoFile();
    if(navigator.share && navigator.canShare?.({files:[x.file]})){
      await navigator.share({files:[x.file],title:"Фото из КОЛЯГРАМА"});
    }else if(navigator.share){
      await navigator.share({url:x.url,title:"Фото из КОЛЯГРАМА"});
    }else{
      window.open(x.url,"_blank");
    }
  }catch(e){toast("Не удалось поделиться")}
});
document.getElementById("downloadPhotoViewer")?.addEventListener("click",async()=>{
  try{
    const x=await currentPhotoFile();
    const objectUrl=URL.createObjectURL(x.blob);
    const a=document.createElement("a");
    a.href=objectUrl;
    a.download=x.file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
    toast("Фото готово к сохранению");
  }catch(e){toast("Не удалось скачать фото")}
});

const BG_MUSIC_KEY="kolyagram-bg-music";
let bgMusicEnabled=localStorage.getItem(BG_MUSIC_KEY)!=="off";
let bgMusicUnlocked=false;

function bgAudio(){ return document.getElementById("backgroundMusic"); }

function updateBgButton(){
  const b=document.getElementById("toggleBackgroundMusic");
  if(b)b.textContent=`🎵 Фоновая музыка: ${bgMusicEnabled?"Вкл":"Выкл"}`;
}

async function startBackgroundMusic(){
  const a=bgAudio();
  if(!a || !bgMusicEnabled)return;
  a.loop=true;
  a.volume=0.12;
  try{
    await a.play();
    bgMusicUnlocked=true;
  }catch(e){}
}

function stopBackgroundMusic(){
  const a=bgAudio();
  if(a)a.pause();
}

async function unlockBackgroundMusic(){
  if(bgMusicUnlocked || !bgMusicEnabled)return;
  await startBackgroundMusic();
}

document.addEventListener("click",unlockBackgroundMusic,{once:true});
document.addEventListener("touchend",unlockBackgroundMusic,{once:true});

document.getElementById("toggleBackgroundMusic")?.addEventListener("click",async()=>{
  bgMusicEnabled=!bgMusicEnabled;
  localStorage.setItem(BG_MUSIC_KEY,bgMusicEnabled?"on":"off");
  updateBgButton();
  if(bgMusicEnabled) await startBackgroundMusic();
  else stopBackgroundMusic();
});
updateBgButton();

// При возвращении в приложение продолжаем музыку, если iOS не убил аудио.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && bgMusicEnabled) startBackgroundMusic();
});

// При проигрывании голосового фон ставим на паузу, после продолжаем.
// Делегирование работает и для динамически созданных audio.
document.addEventListener("play",e=>{
  const el=e.target;
  if(el instanceof HTMLAudioElement && el.id!=="backgroundMusic" && el.id!=="messageSound"){
    const bg=bgAudio();
    if(bg && !bg.paused){
      bg.dataset.resumeAfterVoice="1";
      bg.pause();
    }
  }
},true);

function resumeBgAfterVoice(){
  const bg=bgAudio();
  if(bg?.dataset.resumeAfterVoice==="1"){
    bg.dataset.resumeAfterVoice="";
    if(bgMusicEnabled) startBackgroundMusic();
  }
}
document.addEventListener("ended",e=>{
  const el=e.target;
  if(el instanceof HTMLAudioElement && el.id!=="backgroundMusic" && el.id!=="messageSound") resumeBgAfterVoice();
},true);
document.addEventListener("pause",e=>{
  const el=e.target;
  if(el instanceof HTMLAudioElement && el.id!=="backgroundMusic" && el.id!=="messageSound") resumeBgAfterVoice();
},true);
